version: 2

updates:
  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # PHP dependencies (composer.json)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
    versioning-strategy: "widen"

  # JS build tooling (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
    groups:
      npm-dev:
        dependency-type: "development"